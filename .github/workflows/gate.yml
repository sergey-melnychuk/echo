# The four quality gates from SPEC.md section 8, on Linux and macOS.
# Tests run on loopback only and spawn the binary once; no network access
# beyond 127.0.0.1 is needed.
name: gate

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt, check, clippy, test
        run: ./scripts/gate.sh
