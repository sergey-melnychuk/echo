[package]
name = "vaultsync"
version = "0.1.0"
edition = "2021"
# Maximum rust-version among the dependencies (iroh, iroh-blobs, iroh-docs).
rust-version = "1.91"
description = "Proof of concept: serverless folder sync on iroh, iroh-docs, iroh-blobs and Automerge, with Biscuit-token admission"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["p2p", "sync", "iroh", "automerge", "crdt"]
categories = ["filesystem", "network-programming"]
# A proof of concept, not a crates.io release.
publish = false

[dependencies]
iroh = "1.2"
# Default features add the RPC layer (`rpc`, pulls in `noq`), which is not used in-process.
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
# Default features add `rpc` and `redb-v2-migration` (a second redb for stores from iroh-docs 0.94-0.98).
iroh-docs = { version = "0.101", default-features = false, features = ["fs-store"] }
iroh-gossip = "0.101"
automerge = "=0.12.0"
biscuit-auth = "6"
fastcdc = "5"
notify = "8"
notify-debouncer-full = "0.7"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
blake3 = "1"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Not in SPEC.md section 3: stream combinators (`next`, `try_collect`) for the
# `impl Stream` values that iroh-docs and iroh-blobs return. See NOTES.md.
n0-future = "0.3"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
